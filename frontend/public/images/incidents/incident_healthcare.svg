<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="health-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="60%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#1c0505" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#health-bg)" />

  <!-- Community Clinic Wall & Signboard -->
  <rect x="80" y="80" width="640" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <rect x="120" y="110" width="220" height="40" rx="6" fill="#0f172a" />
  <text x="135" y="136" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="bold">🏥 COMMUNITY CLINIC</text>

  <!-- Biohazard & Medical Waste Yellow/Red Bins -->
  <rect x="220" y="240" width="90" height="130" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="3" />
  <rect x="340" y="220" width="100" height="150" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="3" />
  <rect x="470" y="250" width="90" height="120" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="3" />

  <!-- Biohazard warning symbol -->
  <circle cx="390" cy="280" r="22" fill="#ffffff" opacity="0.9" />
  <polygon points="390,265 405,295 375,295" fill="#b91c1c" />

  <!-- Uncollected clinical bags spilled in backyard -->
  <path d="M160,400 Q280,360 400,410 Q540,370 660,410 L660,490 L160,490 Z" fill="#0b0f19" />
  <circle cx="280" cy="420" r="25" fill="#fca5a5" opacity="0.6" />
  <circle cx="340" cy="430" r="22" fill="#fef08a" opacity="0.6" />

  <!-- Camera HUD & Forensic Telemetry Overlay -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#f87171" stroke-opacity="0.3" stroke-width="1.5" rx="8" />
  <rect x="35" y="35" width="310" height="32" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="56" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold">🏥 CIVIC RADAR: BIO_WASTE_HAZARD #189</text>
  
  <rect x="35" y="425" width="460" height="35" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="447" fill="#ffffff" font-family="monospace" font-size="11">GPS: 23.7501° N, 90.3920° E | WARD 18 TEJGAON</text>
  
  <rect x="620" y="35" width="145" height="32" rx="6" fill="#dc2626" fill-opacity="0.9" />
  <text x="635" y="56" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">HAZARD LEVEL 1</text>
</svg>
