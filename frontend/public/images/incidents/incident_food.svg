<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="food-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1e0b02" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#food-bg)" />

  <!-- Commercial kitchen table / rusty counter -->
  <rect x="60" y="220" width="680" height="230" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="4" />
  
  <!-- Grimy industrial pots & oil containers -->
  <rect x="140" y="160" width="120" height="110" rx="6" fill="#57534e" stroke="#292524" stroke-width="3" />
  <ellipse cx="200" cy="160" rx="60" ry="14" fill="#44403c" />
  <rect x="130" y="190" width="140" height="10" fill="#292524" />

  <!-- Open chemical drum / unhygienic adulterant barrel -->
  <rect x="340" y="140" width="140" height="150" rx="8" fill="#b45309" stroke="#78350f" stroke-width="4" />
  <ellipse cx="410" cy="140" rx="70" ry="18" fill="#d97706" />
  <text x="365" y="215" fill="#fef3c7" font-family="monospace" font-size="12" font-weight="bold">FOOD ADULTERANT</text>
  <line x1="360" y1="225" x2="460" y2="225" stroke="#fef3c7" stroke-width="2" />

  <!-- Warning Red Seal: SEALED FOR CONTAMINATION -->
  <circle cx="580" cy="220" r="55" fill="#dc2626" opacity="0.95" stroke="#991b1b" stroke-width="4" stroke-dasharray="6 3" />
  <text x="548" y="216" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="black">HEALTH</text>
  <text x="542" y="234" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="black">VIOLATION</text>

  <!-- Camera HUD & Forensic Telemetry Overlay -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5" rx="8" />
  <rect x="35" y="35" width="310" height="32" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="56" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">🍲 CIVIC RADAR: FOOD_HYGIENE_BREACH #190</text>
  
  <rect x="35" y="425" width="460" height="35" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="447" fill="#ffffff" font-family="monospace" font-size="11">GPS: 23.7380° N, 90.3950° E | WARD 19 KHILGAON</text>
  
  <rect x="620" y="35" width="145" height="32" rx="6" fill="#d97706" fill-opacity="0.9" />
  <text x="640" y="56" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">INSPECTION</text>
</svg>
