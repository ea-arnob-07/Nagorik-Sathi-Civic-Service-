<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="elec-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Utility pole structure -->
  <line x1="200" y1="50" x2="200" y2="480" stroke="#475569" stroke-width="14" stroke-linecap="round" />
  <line x1="120" y1="120" x2="280" y2="120" stroke="#334155" stroke-width="10" stroke-linecap="round" />
  <line x1="140" y1="200" x2="260" y2="200" stroke="#334155" stroke-width="8" stroke-linecap="round" />

  <!-- Tangled drooping electric wires -->
  <path d="M130,120 Q350,340 700,160" fill="none" stroke="#0f172a" stroke-width="7" />
  <path d="M130,120 Q350,340 700,160" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 4" />
  <path d="M200,200 Q400,420 650,220" fill="none" stroke="#1e293b" stroke-width="6" />
  <path d="M200,200 Q400,420 650,220" fill="none" stroke="#fbbf24" stroke-width="2" />
  <path d="M270,120 Q480,390 780,240" fill="none" stroke="#090d16" stroke-width="8" />

  <!-- Live electrical spark glow -->
  <circle cx="400" cy="380" r="90" fill="url(#spark)" />
  <polygon points="400,320 410,365 435,365 405,420 415,375 390,375" fill="#fef08a" />

  <!-- Ground puddles and street reflection -->
  <rect y="440" width="800" height="60" fill="#020617" opacity="0.9" />

  <!-- Camera HUD & Forensic Telemetry Overlay -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5" rx="8" />
  <rect x="35" y="35" width="280" height="32" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="56" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">⚡ CIVIC RADAR: ELEC_HAZARD #192</text>
  
  <rect x="35" y="425" width="460" height="35" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="447" fill="#ffffff" font-family="monospace" font-size="11">GPS: 23.7956° N, 90.3537° E | WARD 8 MIRPUR</text>
  
  <rect x="620" y="35" width="145" height="32" rx="6" fill="#dc2626" fill-opacity="0.9" />
  <text x="635" y="56" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">EMERGENCY</text>
</svg>
