<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="water-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#021d32" />
    </linearGradient>
    <radialGradient id="spray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#water-bg)" />

  <!-- Asphalt road cutout & excavated trench -->
  <rect x="0" y="320" width="800" height="180" fill="#0f172a" />
  <ellipse cx="400" cy="380" rx="350" ry="80" fill="#030712" />

  <!-- Heavy iron water main pipeline -->
  <rect x="80" y="360" width="640" height="60" rx="10" fill="#334155" stroke="#1e293b" stroke-width="4" />
  <circle cx="200" cy="390" r="14" fill="#1e293b" />
  <circle cx="600" cy="390" r="14" fill="#1e293b" />

  <!-- Burst fracture on pipe with high-pressure water plume -->
  <circle cx="420" cy="270" r="140" fill="url(#spray)" />
  <path d="M410,360 Q380,200 420,120 Q460,200 430,360" fill="#7dd3fc" opacity="0.8" />
  <path d="M415,360 Q400,160 425,100 Q450,160 425,360" fill="#bae6fd" opacity="0.95" />

  <!-- Water puddles across pavement -->
  <ellipse cx="430" cy="420" rx="220" ry="40" fill="#0284c7" opacity="0.6" />
  <ellipse cx="300" cy="440" rx="140" ry="25" fill="#38bdf8" opacity="0.4" />

  <!-- Camera HUD & Forensic Telemetry Overlay -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" rx="8" />
  <rect x="35" y="35" width="290" height="32" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="56" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">💧 CIVIC RADAR: WASA_PIPE_BURST #193</text>
  
  <rect x="35" y="425" width="460" height="35" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="45" y="447" fill="#ffffff" font-family="monospace" font-size="11">GPS: 23.7612° N, 90.3621° E | WARD 5 MOHAMMADPUR</text>
  
  <rect x="620" y="35" width="145" height="32" rx="6" fill="#0284c7" fill-opacity="0.9" />
  <text x="645" y="56" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">PRIORITY HIGH</text>
</svg>
